name: Release

# 태그를 밀면 여기서 굽고 릴리스에 올린다.
#
# 빌드를 여기로 옮긴 이유는 두 가지다.
# 하나는 SignPath Foundation이 서명해 주려면 지원되는 CI에서 나온 빌드여야 하고,
# 다른 하나는 개인 PC의 백신이 만들어진 파일을 건드리는 문제가 여기서는 없기 때문이다.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '올릴 태그 (예: v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json 그대로 설치한다. 빌드가 매번 같은 결과를 내야 한다
      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 빌드와 패키징
        run: npm run package

      # ─────────────────────────────────────────────────────────────
      # SignPath 승인 후 여기에 서명 단계가 들어간다.
      #
      #   - uses: signpath/github-action-submit-signing-request@v1
      #     with:
      #       api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #       organization-id: <SignPath에서 받은 값>
      #       project-slug: tt-servermaker
      #       signing-policy-slug: release-signing
      #       artifact-configuration-slug: installer
      #       github-artifact-id: <아래 보관 단계가 돌려주는 id>
      #       wait-for-completion: true
      #       output-artifact-directory: dist
      #
      # 서명은 SignPath에 올라간 아티팩트를 대상으로 한다. 그래서 아래 "결과물 보관"을
      # 이 자리 앞으로 옮기고, 서명된 파일이 dist로 돌아온 뒤에 해시 계산과 릴리스가
      # 이어지도록 순서를 바꾸면 된다.
      # ─────────────────────────────────────────────────────────────

      - name: 설치본 확인과 해시
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter '*-x64.exe' | Select-Object -First 1
          if (-not $exe) { throw '설치본을 찾지 못했습니다' }

          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $sizeMb = [math]::Round($exe.Length / 1MB, 1)

          "path=$($exe.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          "name=$($exe.Name)"     | Out-File $env:GITHUB_OUTPUT -Append
          "sha256=$hash"          | Out-File $env:GITHUB_OUTPUT -Append

          Write-Host "$($exe.Name)  $sizeMb MB"
          Write-Host "SHA256  $hash"

      # 태그 없이 돌려봤을 때도 결과물은 남겨둔다
      - name: 결과물 보관
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*-x64.exe
          retention-days: 14

      - name: 릴리스에 올리기
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
          SHA256: ${{ steps.installer.outputs.sha256 }}
          EXE_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') {
            $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $env:TAG_INPUT
          }
          if (-not $tag) { throw '태그를 알 수 없습니다' }

          $version = $tag -replace '^v', ''

          $lines = @(
            '설치본을 받아 실행하세요. 64비트 윈도우용입니다.'
            ''
            '처음 실행할 때 Windows SmartScreen 경고가 뜨면 "추가 정보" 다음 "실행"을 누르면 됩니다.'
            '받은 파일을 우클릭해 속성에서 "차단 해제"를 체크하면 경고 없이 실행됩니다.'
            ''
            '받은 파일 확인용 해시'
            ''
            '    SHA256  ' + $env:SHA256
            ''
            '전체 변경 내용은 커밋 기록을 참고하세요.'
            ''
            '---'
            ''
            'NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.'
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $lines -Encoding utf8

          # 릴리스가 이미 있으면 만들기는 실패한다. 그건 정상이고 파일만 갈아끼운다
          gh release create $tag --title "서버 메이커 $version" --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) {
            Write-Host "릴리스 $tag 가 이미 있습니다. 파일만 갱신합니다."
          }

          gh release upload $tag $env:EXE_PATH --clobber
          if ($LASTEXITCODE -ne 0) { throw '릴리스에 파일을 올리지 못했습니다' }
